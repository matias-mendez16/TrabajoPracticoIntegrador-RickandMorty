<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="/Iconos/Morty.png" >
</head>

<body class="colorFondo">
    <header>

        <!-- Boton Anterior -->

        <ul class="nav nav-pills nav-fill">
            <li class="nav-item">
                <button class="nav-link active colorBotones" id="anterior" aria-current="page">Anterior</button>
            </li>

            <!-- Inicio Filtro por status -->

            <li class="nav-item">
                <select id="filtroStatus" class="form-select filtros" aria-label="Filtro por status">
                    <option value="">Todos los personajes</option>
                    <option value="alive">Vivo</option>
                    <option value="dead">Muerto</option>
                    <option value="unknown">Desconocido</option>
                </select>
            </li>

            <!-- Fin Filtro por status -->            

            <!-- Barra de Busqueda por nombre -->

            <li class="nav-item">
                <form id="formBuscar" class="d-flex" role="search">
                    <input id="buscarNombre" class="form-control me-1 barraBusqueda" type="search" placeholder= "Buscar por nombre" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </li>

            <!-- Boton Siguiente -->

            <li class="nav-item">
                <button class="nav-link active colorBotones" id="siguiente" aria-current="page">Siguiente</button>
            </li>
        </ul>
    </header>

    <!-- Logo y texto  -->

    <img class="imgLogo" src="/Imagenes/Logo RickandMorty.png" alt="Logo de Rick and Morty">
    <h1 class="title">Personajes</h1>    
    <div id="personajes"> </div>

    <footer>

        <!-- Inicio de botones Anterior/Siguiente -->

        <ul class="nav nav-pills nav-fill">
            <li class="nav-item">
                <button class="nav-link active colorBotones" id="anterior2" aria-current="page">Anterior</button>
            </li>
            <li class="nav-item">
                <button class="nav-link active colorBotones" id="siguiente2" aria-current="page">Siguiente</button>
            </li>
        </ul>

        <!-- Fin de botones Anterior/Siguiente -->

    </footer>

<script src="/JavaScript/script.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
